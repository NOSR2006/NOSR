<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="NOSR Dashboard — 个人控制面板">
    <meta name="theme-color" content="#0d1117">
    <meta name="robots" content="noindex, nofollow">
    <title>NOSR Dashboard</title>
    <link rel="icon" href="./img/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="./img/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/dashboard.css">
    <script type="module" src="./js/dashboard.js"></script>
</head>
<body>

    <!-- ====== 登录遮罩 ====== -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-logo">
                <img src="./img/logo.png" alt="NOSR">
            </div>
            <h2>NOSR Dashboard</h2>
            <p class="login-desc">私密空间，请输入访问密码</p>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="输入密码..."
                        autocomplete="current-password" required>
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </div>
                <p id="loginError" class="login-error"></p>
            </form>
            <button id="guestBtn" class="btn-guest">以访客身份浏览</button>
        </div>
    </div>

    <!-- ====== 顶部栏 ====== -->
    <header id="topBar" class="topbar" style="display:none">
        <div class="topbar-left">
            <img src="./img/logo.png" alt="NOSR" class="topbar-logo">
            <span class="topbar-title">NOSR Dashboard</span>
            <span id="roleBadge" class="role-badge"></span>
        </div>
        <div class="topbar-center">
            <div id="clock" class="clock">
                <span id="clockTime"></span>
                <span id="clockDate"></span>
            </div>
        </div>
        <div class="topbar-right">
            <button id="refreshBtn" class="topbar-btn" title="刷新数据">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button id="settingsBtn" class="topbar-btn" title="设置">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button id="logoutBtn" class="topbar-btn" title="退出">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <!-- ====== 仪表盘主体 ====== -->
    <main id="dashboard" class="dashboard" style="display:none">

        <!-- 第一行：天气 + 时钟快捷 -->
        <section class="panel weather-panel">
            <div class="panel-header">
                <h3><i class="fa-solid fa-cloud-sun"></i> 天气</h3>
            </div>
            <div class="weather-content">
                <div class="weather-main">
                    <span id="weatherTemp" class="weather-temp">--°C</span>
                    <span id="weatherDesc" class="weather-desc">--</span>
                </div>
                <div class="weather-details">
                    <div class="weather-item">
                        <i class="fa-solid fa-droplet"></i>
                        <span id="weatherHumidity">--</span>
                    </div>
                    <div class="weather-item">
                        <i class="fa-solid fa-eye"></i>
                        <span id="weatherVisibility">--</span>
                    </div>
                    <div class="weather-item">
                        <i class="fa-solid fa-temperature-high"></i>
                        <span id="weatherFeels">--</span>
                    </div>
                    <div class="weather-item">
                        <i class="fa-solid fa-cloud"></i>
                        <span id="weatherClouds">--</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 快捷入口 -->
        <section class="panel bookmarks-panel">
            <div class="panel-header">
                <h3><i class="fa-solid fa-bookmark"></i> 快捷入口</h3>
                <button id="addBookmarkBtn" class="panel-btn admin-only" title="添加书签">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="bookmarksGrid" class="bookmarks-grid">
                <!-- 默认内置快捷入口 -->
                <a href="https://github.com" target="_blank" rel="noopener" class="bookmark-item">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub</span>
                </a>
                <a href="https://mail.google.com" target="_blank" rel="noopener" class="bookmark-item">
                    <i class="fa-solid fa-envelope"></i>
                    <span>Gmail</span>
                </a>
                <a href="https://chatgpt.com" target="_blank" rel="noopener" class="bookmark-item">
                    <i class="fa-solid fa-robot"></i>
                    <span>ChatGPT</span>
                </a>
                <a href="https://alist.nosr.top" target="_blank" rel="noopener" class="bookmark-item">
                    <i class="fa-solid fa-cloud"></i>
                    <span>网盘</span>
                </a>
                <a href="https://dash.nosr.top" target="_blank" rel="noopener" class="bookmark-item">
                    <i class="fa-solid fa-folder-closed"></i>
                    <span>面板</span>
                </a>
                <a href="https://bitwarden.nosr.top" target="_blank" rel="noopener" class="bookmark-item">
                    <i class="fa-solid fa-key"></i>
                    <span>密码</span>
                </a>
            </div>
        </section>

        <!-- 第二行左：待办事项 -->
        <section class="panel todos-panel">
            <div class="panel-header">
                <h3><i class="fa-solid fa-list-check"></i> 待办事项</h3>
                <div class="panel-header-right">
                    <span id="todoCount" class="todo-count">0</span>
                    <button id="addTodoBtn" class="panel-btn admin-only" title="添加待办">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>
            <div id="todoList" class="todo-list">
                <!-- 动态渲染 -->
                <p class="empty-hint">暂无待办事项</p>
            </div>
            <div id="todoInput" class="todo-input hidden">
                <input type="text" id="todoTextInput" placeholder="添加新任务..." maxlength="200">
                <div class="todo-input-actions">
                    <select id="todoPriority">
                        <option value="low">低优先</option>
                        <option value="medium" selected>中优先</option>
                        <option value="high">高优先</option>
                    </select>
                    <button id="todoSaveBtn" class="btn-sm btn-primary">保存</button>
                    <button id="todoCancelBtn" class="btn-sm">取消</button>
                </div>
            </div>
        </section>

        <!-- 第二行右：速记笔记 -->
        <section class="panel notes-panel">
            <div class="panel-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> 速记</h3>
                <button id="addNoteBtn" class="panel-btn admin-only" title="新建笔记">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="noteList" class="note-list">
                <p class="empty-hint">暂无笔记</p>
            </div>
            <!-- 笔记编辑弹窗 -->
            <div id="noteEditor" class="note-editor hidden">
                <input type="text" id="noteTitleInput" placeholder="标题..." maxlength="100">
                <textarea id="noteContentInput" placeholder="内容..." rows="6" maxlength="2000"></textarea>
                <div class="note-editor-actions">
                    <button id="noteSaveBtn" class="btn-sm btn-primary">保存</button>
                    <button id="noteCancelBtn" class="btn-sm">取消</button>
                </div>
            </div>
        </section>

        <!-- 第三行左：RSS 订阅 -->
        <section class="panel rss-panel">
            <div class="panel-header">
                <h3><i class="fa-solid fa-rss"></i> 信息流</h3>
                <button id="addRssBtn" class="panel-btn admin-only" title="添加订阅源">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="rssList" class="rss-list">
                <p class="empty-hint">暂无订阅源，点击 + 添加</p>
            </div>
            <div id="rssInput" class="rss-input hidden">
                <input type="url" id="rssUrlInput" placeholder="RSS 订阅地址...">
                <input type="text" id="rssTitleInput" placeholder="订阅源名称（可选）...">
                <div class="rss-input-actions">
                    <button id="rssSaveBtn" class="btn-sm btn-primary">添加</button>
                    <button id="rssCancelBtn" class="btn-sm">取消</button>
                </div>
            </div>
        </section>

        <!-- 第三行右：服务监控 -->
        <section class="panel monitor-panel">
            <div class="panel-header">
                <h3><i class="fa-solid fa-server"></i> 服务状态</h3>
                <button id="addMonitorBtn" class="panel-btn admin-only" title="添加监控">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="monitorList" class="monitor-list">
                <p class="empty-hint">暂无监控目标</p>
            </div>
            <div id="monitorInput" class="monitor-input hidden">
                <input type="text" id="monitorNameInput" placeholder="服务名称...">
                <input type="url" id="monitorUrlInput" placeholder="服务 URL...">
                <div class="monitor-input-actions">
                    <button id="monitorSaveBtn" class="btn-sm btn-primary">添加</button>
                    <button id="monitorCancelBtn" class="btn-sm">取消</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Font Awesome -->
    <script src="./js/fontawesome.min.js"></script>
    <script src="./js/all.min.js"></script>
</body>
</html>
