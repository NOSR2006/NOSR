<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>NOSR</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(120% 120% at 50% 0%, #131a24 0%, #0a0d12 55%, #06080b 100%);
      color: #e6edf3;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .wrap { text-align: center; padding: 2rem; }
    .mark {
      font-size: clamp(3rem, 14vw, 7rem);
      font-weight: 800;
      letter-spacing: .18em;
      line-height: 1;
      background: linear-gradient(180deg, #f2f7ff 0%, #7d8fa6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      user-select: none;
    }
    .rule {
      width: 64px; height: 2px; margin: 1.6rem auto;
      background: linear-gradient(90deg, transparent, #3a4a5f, transparent);
    }
    .msg { font-size: 1rem; letter-spacing: .08em; color: #8b9bb0; }
    .dim { margin-top: 2.4rem; font-size: .75rem; letter-spacing: .1em; color: #46566b; }
    .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #3f7ad6; margin-right: .5rem; vertical-align: middle;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: .7 } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="mark">NOSR</div>
    <div class="rule"></div>
    <p class="msg"><span class="dot"></span>站点重建中</p>
    <p class="dim">UNDER CONSTRUCTION</p>
  </main>
</body>
</html>
