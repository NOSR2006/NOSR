<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>NOSR · 404</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center;
      background: radial-gradient(120% 120% at 50% 0%, #131a24 0%, #0a0d12 55%, #06080b 100%);
      color: #e6edf3;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { text-align: center; padding: 2rem; }
    .code { font-size: clamp(2.4rem, 10vw, 5rem); font-weight: 800; letter-spacing: .14em; color: #24303f; }
    .msg { margin-top: 1rem; font-size: .95rem; letter-spacing: .08em; color: #8b9bb0; }
    a { color: #5b8dd6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .home { display: inline-block; margin-top: 2rem; font-size: .8rem; letter-spacing: .1em; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <p class="msg">这个地址没有内容</p>
    <a class="home" href="/">返回首页</a>
  </main>
</body>
</html>
